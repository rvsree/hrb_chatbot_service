<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#3b4b63" />
    </marker>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
      <feOffset in="blur" dx="0" dy="3" result="offsetBlur" />
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1100" height="340" fill="#f3f5f8" />

  <!-- Header -->
  <rect x="0" y="0" width="1100" height="74" fill="#0f1f3d" />
  <text x="30" y="33" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">Document Ingestion &#8212; How It Works Today</text>
  <text x="30" y="57" fill="#cfd8e8" font-size="13" font-style="italic">&#9312; Upload &#8594; &#9313; Extract &#8594; &#9314; Chunk &#8594; &#9315; Embed &#8594; &#9316; Store &#8212; synchronous, one file at a time</text>
  <rect x="930" y="24" width="142" height="26" rx="13" fill="#e8b64a" />
  <text x="1001" y="41" fill="#1f2937" font-size="10.5" font-weight="700" letter-spacing="0.4" text-anchor="middle">VIEW &#183; ACTUAL FLOW</text>

  <!-- Pipeline track -->
  <rect x="45" y="289" width="1010" height="4" rx="2" fill="#dde3ec" />

  <!-- Box 1: Upload -->
  <g filter="url(#cardShadow)">
    <rect x="45" y="132" width="170" height="150" rx="12" fill="#eaf1fb" stroke="#2f5fa8" stroke-width="1.5" />
  </g>
  <circle cx="63" cy="150" r="12" fill="#16233f" />
  <text x="63" y="154" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">1</text>
  <circle cx="130" cy="166" r="18" fill="#ffffff" stroke="#2f5fa8" stroke-width="1.5" />
  <line x1="130" y1="174" x2="130" y2="159" stroke="#2f5fa8" stroke-width="2" stroke-linecap="round" />
  <polygon points="123 163, 137 163, 130 153" fill="#2f5fa8" />
  <text x="130" y="224" fill="#16233f" font-size="15" font-weight="700" text-anchor="middle">Upload</text>
  <text x="130" y="244" fill="#51607a" font-size="11" text-anchor="middle">HR Support uploads</text>
  <text x="130" y="258" fill="#51607a" font-size="11" text-anchor="middle">a document</text>
  <line x1="215" y1="207" x2="247" y2="207" stroke="#3b4b63" stroke-width="1.75" marker-end="url(#arrowhead)" />

  <!-- Box 2: Extract -->
  <g filter="url(#cardShadow)">
    <rect x="255" y="132" width="170" height="150" rx="12" fill="#eaf1fb" stroke="#2f5fa8" stroke-width="1.5" />
  </g>
  <circle cx="273" cy="150" r="12" fill="#16233f" />
  <text x="273" y="154" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">2</text>
  <circle cx="340" cy="166" r="18" fill="#ffffff" stroke="#2f5fa8" stroke-width="1.5" />
  <line x1="328" y1="160" x2="352" y2="160" stroke="#2f5fa8" stroke-width="2" stroke-linecap="round" />
  <line x1="328" y1="166" x2="352" y2="166" stroke="#2f5fa8" stroke-width="2" stroke-linecap="round" />
  <line x1="328" y1="172" x2="344" y2="172" stroke="#2f5fa8" stroke-width="2" stroke-linecap="round" />
  <text x="340" y="224" fill="#16233f" font-size="15" font-weight="700" text-anchor="middle">Extract</text>
  <text x="340" y="244" fill="#51607a" font-size="11" text-anchor="middle">Text pulled from</text>
  <text x="340" y="258" fill="#51607a" font-size="11" text-anchor="middle">the file</text>
  <line x1="425" y1="207" x2="457" y2="207" stroke="#3b4b63" stroke-width="1.75" marker-end="url(#arrowhead)" />

  <!-- Box 3: Chunk -->
  <g filter="url(#cardShadow)">
    <rect x="465" y="132" width="170" height="150" rx="12" fill="#eaf1fb" stroke="#2f5fa8" stroke-width="1.5" />
  </g>
  <circle cx="483" cy="150" r="12" fill="#16233f" />
  <text x="483" y="154" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">3</text>
  <circle cx="550" cy="166" r="18" fill="#ffffff" stroke="#2f5fa8" stroke-width="1.5" />
  <rect x="534" y="158" width="8" height="16" rx="2" fill="#2f5fa8" />
  <rect x="546" y="158" width="8" height="16" rx="2" fill="#2f5fa8" />
  <rect x="558" y="158" width="8" height="16" rx="2" fill="#2f5fa8" />
  <text x="550" y="224" fill="#16233f" font-size="15" font-weight="700" text-anchor="middle">Chunk</text>
  <text x="550" y="244" fill="#51607a" font-size="11" text-anchor="middle">Split into smaller</text>
  <text x="550" y="258" fill="#51607a" font-size="11" text-anchor="middle">pieces</text>
  <line x1="635" y1="207" x2="667" y2="207" stroke="#3b4b63" stroke-width="1.75" marker-end="url(#arrowhead)" />

  <!-- Box 4: Embed -->
  <g filter="url(#cardShadow)">
    <rect x="675" y="132" width="170" height="150" rx="12" fill="#eaf1fb" stroke="#2f5fa8" stroke-width="1.5" />
  </g>
  <circle cx="693" cy="150" r="12" fill="#16233f" />
  <text x="693" y="154" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">4</text>
  <circle cx="760" cy="166" r="18" fill="#ffffff" stroke="#2f5fa8" stroke-width="1.5" />
  <line x1="753" y1="159" x2="753" y2="173" stroke="#bcd0ee" stroke-width="1.5" />
  <line x1="767" y1="159" x2="767" y2="173" stroke="#bcd0ee" stroke-width="1.5" />
  <line x1="753" y1="159" x2="767" y2="159" stroke="#bcd0ee" stroke-width="1.5" />
  <line x1="753" y1="173" x2="767" y2="173" stroke="#bcd0ee" stroke-width="1.5" />
  <circle cx="753" cy="159" r="3" fill="#2f5fa8" />
  <circle cx="767" cy="159" r="3" fill="#2f5fa8" />
  <circle cx="753" cy="173" r="3" fill="#2f5fa8" />
  <circle cx="767" cy="173" r="3" fill="#2f5fa8" />
  <text x="760" y="224" fill="#16233f" font-size="15" font-weight="700" text-anchor="middle">Embed</text>
  <text x="760" y="244" fill="#51607a" font-size="11" text-anchor="middle">Each chunk becomes</text>
  <text x="760" y="258" fill="#51607a" font-size="11" text-anchor="middle">a vector</text>
  <line x1="845" y1="207" x2="877" y2="207" stroke="#3b4b63" stroke-width="1.75" marker-end="url(#arrowhead)" />

  <!-- Box 5: Store (vector database) -->
  <g filter="url(#cardShadow)">
    <rect x="885" y="132" width="170" height="150" rx="12" fill="#e6f6ea" stroke="#2f8f4e" stroke-width="1.5" />
  </g>
  <circle cx="903" cy="150" r="12" fill="#2f8f4e" />
  <text x="903" y="154" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">5</text>
  <circle cx="970" cy="166" r="18" fill="#ffffff" stroke="#2f8f4e" stroke-width="1.5" />
  <ellipse cx="970" cy="159" rx="11" ry="4" fill="#2f8f4e" />
  <rect x="959" y="159" width="22" height="12" fill="#5cb37d" />
  <ellipse cx="970" cy="171" rx="11" ry="4" fill="#2f8f4e" />
  <text x="970" y="224" fill="#1d5c32" font-size="15" font-weight="700" text-anchor="middle">Store</text>
  <text x="970" y="244" fill="#3c6b4c" font-size="11" text-anchor="middle">Saved to the vector</text>
  <text x="970" y="258" fill="#3c6b4c" font-size="11" text-anchor="middle">database</text>

  <text x="550" y="320" fill="#6b7280" font-size="11.5" font-style="italic" text-anchor="middle">
    Uploading several files runs this same sequence one file at a time - not in parallel, not in the background.
  </text>
</svg>
