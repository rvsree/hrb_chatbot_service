models:
  - type: main
    engine: openai
    # Phase 243 - input/output safety checks are a classification task, tiered
    # onto the cheap model like the Planner/decompose steps. No request-level
    # override here (see RAG-ROADMAP.md Phase 243's "Out of scope" - this is a
    # static YAML loaded into a cached LLMRails singleton, not per-call).
    model: gpt-4.1-nano

rails:
  input:
    flows:
      - self check input
      - mask sensitive data on input
  output:
    flows:
      - self check output
      - mask sensitive data on output

  config:
    sensitive_data_detection:
      input:
        entities:
          - PERSON
          - EMAIL_ADDRESS
          - US_SSN
          - CREDIT_CARD
      output:
        entities:
          - PERSON
          - EMAIL_ADDRESS
          - US_SSN
          - CREDIT_CARD
