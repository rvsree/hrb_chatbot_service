name: CI

# Runs on every push and PR, on every branch - no AWS credentials are needed
# here at all, deliberately: this workflow only proves the app still
# imports, the test suite still passes at an enforced coverage floor, no
# dependency or static-analysis security finding has snuck in, and the
# Docker image still builds - none of which touches AWS. Deployment
# (deploy.yml) is the only workflow that needs real credentials, and it's
# scoped to master only - see that file for why.
#
# Branch note (2026-09-08): this repo's branches were renamed on GitHub -
# main -> master, developer -> develop, feature-kb-indexing-rag-pipeline ->
# feature-langchain-rag-pipeline. `pull_request.branches` below was updated
# to match; missing this rename here would have meant PRs into master
# silently never triggered CI. See docs/agent-reference/CICD-BRANCHING-STRATEGY.md for the
# branch roles and the testing gates each one is meant to enforce.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master", "develop"]

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Import the app
        # Cheapest possible check, run first: a broken import (a bad
        # merge, a missing dependency, a circular import) fails loudly
        # here instead of silently at the next deploy, before spending
        # time running the full suite below.
        run: python -c "import src.hrb_chatbot.main"

      - name: Run the test suite, with a minimum coverage floor
        # No test here needs an API key or network call (see
        # docs/agent-reference/TESTING-GUIDE.md) - every one runs against a fake client,
        # so this step needs no secrets, matching this whole workflow's
        # "no AWS credentials at all" design.
        #
        # --cov-fail-under=45: measured, not guessed - a first attempt at
        # this line used 70% and would have failed on the very first real
        # run (actual coverage the day this was added: 46%, see
        # docs/agent-reference/CICD-BRANCHING-STRATEGY.md's "why 45, not some rounder
        # number" note). Most of the gap is the LLM/vector-DB provider
        # clients (openai/anthropic/bedrock/pinecone/postgres/tavily),
        # whose network-calling branches this suite deliberately never
        # exercises - see docs/agent-reference/TESTING-GUIDE.md - plus the still-stubbed
        # ai/rag_pipeline/pipeline.py. This is a ratchet, not a target:
        # it should only ever move up as real tests are added, never down
        # to accommodate a drop in coverage.
        run: python -m pytest -v --cov=src/hrb_chatbot --cov-report=term-missing --cov-fail-under=45

  # Phase 196 - split from one "security" job into 2 real, independent
  # jobs (not a frontend-only relabel) - matches how Test suite and
  # Docker image builds were already separate jobs, and the Pipeline UI
  # now shows these as 2 genuinely separately-timed/colored boxes, not 2
  # steps buried inside one shared job. dependency-scan and static-
  # analysis duplicate "Check out"/"Set up Python"/"Install dependencies"
  # rather than sharing a setup job - same self-contained-job pattern
  # every other job in this file already uses, no new abstraction.
  dependency-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pip-audit - known CVEs in dependencies (report only, not yet blocking)
        # Measured before deciding, same lesson as the coverage floor above:
        # a first attempt at this step let pip-audit fail the job on any
        # finding, and running it here for real turned up dozens of
        # pre-existing CVEs across langchain/chromadb/starlette/pillow -
        # this repo's dependencies were pinned for compatibility (see
        # README.md's Dependencies section, and Prerequisites on chromadb's
        # own Python-version fragility) months before this scan existed, not
        # audited against CVEs as they were pinned. Blocking on that backlog
        # today would fail every single run, including this one, before a
        # human has triaged a single finding. continue-on-error: true keeps
        # this visible in every run's log without blocking merges - see
        # docs/agent-reference/CICD-BRANCHING-STRATEGY.md's security-gate section for the
        # triage plan and when this flips to blocking.
        run: pip-audit -r requirements.txt
        continue-on-error: true

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: bandit - static security analysis of src/
        # -ll: only fail on MEDIUM severity and above. LOW-severity bandit
        # findings are frequently stylistic (e.g. flagging any use of
        # `subprocess`) rather than exploitable, and would make this gate
        # noisy enough to get skipped - see
        # docs/agent-reference/CICD-BRANCHING-STRATEGY.md's security-gate section for the
        # reasoning and how to review a finding before suppressing it.
        run: bandit -r src/hrb_chatbot -ll

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Named to distinguish from deploy.yml's own "Build image" step -
      # this one is a sanity check only (tag :ci, never pushed anywhere),
      # not the real deploy artifact.
      - name: Build image (CI sanity check, not pushed)
        # --provenance=false --sbom=false: BuildKit's default attestation
        # manifests are what broke the very first App Runner deployment of
        # this image (CREATE_FAILED, image pulled fine, container never
        # started - AWS services expect a plain Docker v2 manifest, not an
        # OCI image index with attestations). This flag is load-bearing,
        # not cosmetic - dropping it silently reintroduces that bug the
        # next time this workflow builds the real deploy artifact.
        run: docker build --provenance=false --sbom=false -t hrb-chatbot:ci .
