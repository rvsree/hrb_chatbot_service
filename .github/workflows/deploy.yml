name: Deploy

# Only master triggers this - a push to any other branch (including a PR
# branch) never reaches AWS at all. The AWS credentials this job uses
# belong to hrb-chatbot-github-actions-deploy, a dedicated IAM user created
# specifically for this workflow - not the admin identity used to build
# everything in docs/agent-reference/RAG-ROADMAP.md's Phase 10 by hand. That user can only
# push to the hrb-chatbot ECR repository and trigger this one App Runner
# service's deployment - see its inline policy for the exact permissions.
#
# Branch note (2026-09-08): this trigger was `branches: ["main"]` until the
# repo's branches were renamed on GitHub (main -> master, developer ->
# develop, feature-kb-indexing-rag-pipeline -> feature-langchain-rag-pipeline).
# A GitHub branch rename deletes the old ref outright - it leaves no
# redirect - so this trigger would have matched nothing at all (silently:
# no error, the workflow just never runs again) if this line hadn't been
# updated in the same change. See docs/agent-reference/CICD-BRANCHING-STRATEGY.md for the
# intended feature -> develop -> master flow, and why deploy.yml stays
# scoped to master only for now - no staging App Runner service exists yet,
# and standing one up is a real, costed AWS decision, not a code change.
on:
  push:
    branches: ["master"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 418884736369.dkr.ecr.us-east-1.amazonaws.com/hrb-chatbot
  APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-1:418884736369:service/hrb-chatbot/f957548202f343aa8ca91f341d71d85a
  APP_RUNNER_URL: https://mrgysvt6ye.us-east-1.awsapprunner.com

jobs:
  build-and-deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REPOSITORY }}

      - name: Build image
        # --provenance=false --sbom=false --output oci-mediatypes=false:
        # all three matter, not just the first two. Attestation manifests
        # AND OCI-format manifests (as opposed to classic Docker v2 schema2)
        # both independently caused App Runner to pull the image
        # successfully and then silently fail to ever start the container
        # (CREATE_FAILED, zero application logs) - see docs/agent-reference/RAG-ROADMAP.md's
        # Phase 10 for the two real deployment failures this was found the
        # hard way from. Losing any one of these three flags reintroduces
        # one of those two bugs.
        #
        # push=false here, deliberately (Phase 189) - this step only
        # builds, so the Pipeline UI can show build and push as two real,
        # separately-timed stages. The next step re-runs this *exact same*
        # command with only push flipped to true, instead of a separate
        # plain `docker push` after `--load` - `--load` uses a different
        # output path with no guarantee it preserves oci-mediatypes=false,
        # which would risk reintroducing the bug the 3 flags above exist
        # to prevent. Re-running the identical command is a BuildKit cache
        # hit, not a real second build.
        run: |
          docker buildx build \
            --provenance=false --sbom=false \
            --output type=image,name=${{ env.ECR_REPOSITORY }}:latest,oci-mediatypes=false,push=false \
            .

      - name: Push image to ECR
        # Identical to the step above, only push=true - see that step's
        # comment. Cache hit, not a rebuild.
        run: |
          docker buildx build \
            --provenance=false --sbom=false \
            --output type=image,name=${{ env.ECR_REPOSITORY }}:latest,oci-mediatypes=false,push=true \
            .

      - name: Trigger App Runner deployment
        # AutoDeploymentsEnabled is deliberately false on this service (see
        # Phase 10) - pushing a new image to ECR alone does not redeploy it,
        # this explicit call does.
        run: |
          aws apprunner start-deployment --service-arn "${{ env.APP_RUNNER_SERVICE_ARN }}"

      - name: Wait for the new deployment to actually reach RUNNING
        # start-deployment only *begins* a deployment - it returns almost
        # immediately, long before the new container is actually serving
        # traffic. Without this wait, the smoke test below would run
        # against the OLD container (or against nothing, mid-restart) and
        # pass for the wrong reason. Polls DescribeService's own Status
        # field rather than guessing a fixed sleep, and fails the job
        # outright if App Runner reports OPERATION_IN_PROGRESS for more
        # than ~5 minutes or the deployment fails - both real, seen
        # outcomes during Phase 10's three CREATE_FAILED attempts (see
        # docs/agent-reference/RAG-ROADMAP.md), not hypothetical.
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${{ env.APP_RUNNER_SERVICE_ARN }}" \
              --query "Service.Status" --output text)
            echo "App Runner status: $STATUS (check $i/30)"
            if [ "$STATUS" = "RUNNING" ]; then
              exit 0
            fi
            if [ "$STATUS" != "OPERATION_IN_PROGRESS" ]; then
              echo "::error::App Runner reported unexpected status '$STATUS' - deployment did not reach RUNNING"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for App Runner to reach RUNNING after 5 minutes"
          exit 1

      - name: Deployment smoke test - the new container actually answers
        # Confirms the thing that matters, not just that AWS says the
        # deployment succeeded: a real HTTP call to the live URL returns a
        # real 200. Hits /ping, not /health - this job has no reason to spend
        # a provider call just to confirm the container booted; see
        # docs/agent-reference/AWS-DEVOPS-RUNBOOK.md for the deliberate, by-hand /health check.
        run: |
          curl --fail --silent --show-error "${{ env.APP_RUNNER_URL }}/ping"

      - name: Notify deployment status
        # Phase 196 - a real "status notification" stage, deliberately
        # using GitHub's own built-in step summary (GITHUB_STEP_SUMMARY)
        # instead of a Slack/email webhook - zero new secrets, zero setup
        # required. if: always() so this runs and reports even when an
        # earlier step in this job failed; job.status reflects that.
        # Content is only visible on GitHub's own run page (same "never
        # re-host a log" rule this project already follows elsewhere) -
        # the Pipeline UI shows this step's own pass/fail like any other,
        # not the summary text itself.
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### :white_check_mark: Deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :x: Deployment failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- App Runner URL: ${{ env.APP_RUNNER_URL }}"
            echo "- Triggered by: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
